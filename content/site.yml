# HomeDecorPad — site settings
# Edit this file in Pages CMS (Site settings) or directly on GitHub.
# After saving, GitHub Actions rebuilds the site automatically.

brand: HomeDecorPad
domain: https://redlaxx.github.io/HomeDecorPad

# Where reader emails and brand enquiries go. Shown in the footer of the
# legal pages and on the contact page.
email: hello@homedecorpad.com

# Amazon Associates tracking ID. Leave as-is until you are approved,
# then replace with your real tag (e.g. yourname-20).
amazon_tag: YOUR-AMAZON-TAG-20

# Free Formspree form endpoint for the contact page form.
# Create a form at formspree.io, then paste the ID (the part after /f/).
formspree_id: YOUR_FORM_ID

# Google AdSense publisher ID, e.g. ca-pub-1234567890123456
# Leave as-is to keep ads switched OFF. AdSense also needs the
# matching line in ads.txt and your consent message enabled.
adsense_client: ""

# Google Analytics 4 measurement ID, e.g. G-ABCDE12345
# Leave empty to keep analytics switched off.
ga4_id: ""

# Pinterest domain verification code (from Pinterest > Settings > Claimed accounts).
# Leave empty to hide the meta tag.
pinterest_verify: ""

# Social profiles shown in the footer. Remove a line to hide that icon.
social:
  pinterest: ""
  instagram: ""
  facebook: ""
  youtube: ""
