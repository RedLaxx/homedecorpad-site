# HomeDecorPad — site settings
# Edit this file in Pages CMS (Site settings) or directly on GitHub.
# After saving, GitHub Actions rebuilds the site automatically.

brand: HomeDecorPad
domain: https://redlaxx.github.io/homedecorpad-site

# Effective and last-updated dates shown on the Privacy Policy, Cookie Policy,
# Terms of Use, Disclaimer and Affiliate Disclosure pages.
legal_effective_date: 2026-09-23
legal_updated_date: 2026-09-23

# Where reader emails and brand enquiries go.
email: hello@homedecorpad.com

# Amazon Associates tracking ID.
amazon_tag: YOUR-AMAZON-TAG-20

# Free Formspree form endpoint for the contact page form.
formspree_id: YOUR_FORM_ID

# Google AdSense publisher ID, e.g. ca-pub-1234567890123456
adsense_client: ""

# Google Analytics 4 measurement ID, e.g. G-ABCDE12345
ga4_id: ""

# Pinterest domain verification code
pinterest_verify: ""

# Social profiles shown in the footer.
social:
  pinterest: ""
  instagram: ""
  facebook: ""
  youtube: ""

# Comments — choose system:
# - giscus: requires GitHub login, free, no ads, uses Discussions (you already enabled)
# - cusdis: anonymous, no login, free, no ads, needs app ID from cusdis.com
# - none: no comments
comment_system: giscus

# Giscus (GitHub login required)
giscus_enabled: true
giscus_repo: RedLaxx/homedecorpad-site
giscus_repo_id: R_kgDOUoGanw
giscus_category: General
giscus_category_id: DIC_kwDOUoGan84DGS2E
giscus_mapping: pathname
giscus_theme: light

# Cusdis (anonymous, no login) — get free App ID at https://cusdis.com
cusdis_enabled: false
cusdis_app_id: ""
cusdis_host: https://cusdis.com
cusdis_theme: light
