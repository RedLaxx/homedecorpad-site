## Boilerplate

**HomeDecorPad** is a budget-first home decor site for renters and small-space dwellers. We publish practical room ideas, shoppable budget swaps and paint palettes you can recreate this weekend — for real homes with real budgets.

Based in Lagos, writing for readers in the US, UK, Canada and Australia.

## Audience

- Renters, first apartments, small-space dwellers
- US-focused, Pinterest-driven
- Budget-conscious, 25-44

## What we do

- Sponsored placements (labelled)
- Product features & photography
- Pinterest + affiliate campaigns

