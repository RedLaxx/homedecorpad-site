title: Contact & Work With Us
h1: Get in touch
eyebrow: Contact
lede: Questions about a guide, a product recommendation, or working together? Send a message — we read everything and reply to most emails within 2 hours on business days.
form_title: Send a message
form_note: This form uses your Formspree ID from Site settings. If not set, it falls back to email.
other_title: Other ways to reach us
other_body: |
  **Email:** hello@homedecorpad.com

  **Pinterest:** Follow HomeDecorPad — the fastest place to see new guides.

  **Response time:** 1–2 Hours, New York time (GMT-4).

  ---

  ### Work with HomeDecorPad

  Our readers are decorating on a budget: renters, small-space dwellers and first-home buyers in the US, UK, Canada and Australia. We work with brands on:

  - Sponsored placements and editorially-labelled features
  - Product photography and styling for brand accounts
  - Pinterest and affiliate campaigns built on our guides

  **What we do not do:** guest posts, link insertions, paid do-follow links, or unlabelled advertorial. Requests for these may be declined.

faq_title: Common questions
faqs:
  - q: Can I ask you to recommend a product for my room?
    a: Yes — send the room, the rough budget and one photo if you have it. We answer as many as we can, and the best ones become guides.
  - q: Do you accept guest posts?
    a: No. All guides are written in-house. We do consider original, unpublished photography collaborations.
  - q: I found a broken link or a wrong price. Where do I report it?
    a: Email us with the page name. Prices move constantly, so corrections are genuinely helpful and we fix them quickly.
  - q: How do I get my product considered?
    a: Email a one-paragraph pitch with a link and a price. We buy most of what we feature. If a product is sent for review it is disclosed in the post.
