how_to_title: How to shop a room without wasting money
how_to_steps:
  - title: Buy the anchor first.
    body: The rug sets the palette and the warmth of everything above it. Buy it before cushions, art or accessories.
  - title: Buy textiles before objects.
    body: Throws, covers and curtains change how a room feels more than any ornament, and they are usually the cheapest items on the list.
  - title: Buy lighting third.
    body: Two warm bulbs and one extra lamp will do more than a new side table.
  - title: Buy decor last
    body: and only after you have edited the surfaces. Shop with 30% empty space in mind.

sizing_title: Sizing before shopping
sizing_body: Measure your room, your sofa and your window before you open a single product page. Most disappointing budget purchases are a sizing mistake, not a quality one: rugs that are too small, curtains that are too short, lamps that are too short for the table they sit on.

not_link_title: What we do not link to
not_link_body: We do not recommend dropshipped decor with no review history, printed wood-grain finishes, mirrored furniture with bevelled edges, or decorative sets of four. If it only looks good in a product render, it does not make the list.
