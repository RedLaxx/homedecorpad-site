title: Start Here — How to Decorate on a Budget
h1: Make your home look designed — without a designer budget
eyebrow: Start here
lede: 'HomeDecorPad is a small library of decor ideas that are actually finishable.
  Every guide answers three questions: what do I do first, what does it cost, and
  what can I skip?'
buttons:
- label: Browse all guides
  url: /blog.html
  style: primary
- label: Shop the looks
  url: /shop-my-home.html
  style: ghost
how_it_works_title: How this site works
how_it_works_body: 'Most decor content is aimed at people with a renovation budget.
  This site is built for the opposite: renters, first apartments, and anyone furnishing
  a room with a number in mind.


  - **Free fixes before purchases.** Layout, light and editing come first because
  they change a room the most and cost the least.

  - **Prices and order of operations.** We tell you what to buy first, so you never
  spend your budget on the wrong piece.

  - **Honest about the cheap stuff.** We will tell you when a budget item is not worth
  it — and what we would return.

  '
method_title: The four-step method we use in every room
method_steps:
- title: Edit.
  body: Clear every surface, then put back only what earns its place. Free, and it
    does more than any purchase.
- title: Light it.
  body: Warm bulbs (2700K), three sources at three heights, and a dimmer wherever
    it is possible. Under $40 for most rooms.
- title: Anchor it.
  body: One large-size rug, and a colour palette of a dominant neutral plus one accent.
    This is where a room stops feeling like a rental.
- title: Layer it.
  body: 'Texture where colour would be busy: bouclé, linen, wood, brass, a basket,
    one plant. Never more than three objects per surface.'
callout_title: The rule behind all of it
callout_body: Spend on the things your eye lands on — the rug, the lighting, the bedding
  — and save on the things it does not. A $25 throw in the right texture beats a $200
  lamp you cannot see.
