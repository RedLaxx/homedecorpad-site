# HomeDecorPad — Pages CMS configuration
# Docs: https://pagescms.org/docs/configuration/
# Everything editors can change lives in /content. HTML is generated, never edited by hand.

media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: posts
    label: Blog posts
    type: collection
    path: content/posts
    format: yaml-frontmatter
    # The file name (and therefore the URL) is generated from the post title automatically.
    # "My Post: 5 Ideas!" becomes my-post-5-ideas.md — no need to type a slug.
    # Hidden on create and edit so the address cannot be changed by accident in the UI.
    # If you need a different URL, use the optional "URL slug" field below.
    filename:
      template: "{primary}.md"
      field: false
    exclude:
      - README.md
    view:
      primary: title
      sort: date
      order: desc
      fields: [title, date, category, draft]
    fields:
      - name: title
        label: SEO title
        type: string
        required: true
        description: Also used as the headline and the browser tab title. Keep it under 60 characters and put the keyword first.
        options:
          maxlength: 100
      - name: slug
        label: URL slug (optional — leave empty)
        type: string
        description: |
          Leave this empty. The address is generated from the title automatically
          when you create the post, e.g. "5 Small Entryway Ideas" becomes
          /blog/living-room/5-small-entryway-ideas.html
          Only fill it in if you want this post to live at a different address.
          Changing it later is safe — the old address gets a redirect.
        pattern: "^[a-z0-9-]+$"
        options:
          maxlength: 80
      - name: h1
        label: Headline (only if it should differ from the SEO title)
        type: string
      - name: date
        label: Publish date
        type: date
        required: true
      - name: category
        label: Category
        type: select
        required: true
        description: Sets the URL folder, the card artwork and the section on the Decor Ideas page.
        options:
          values:
            - name: living-room
              label: Living Room
            - name: bedroom
              label: Bedroom
            - name: small-space
              label: Small Space & Renters
            - name: get-the-look
              label: Get the Look for Less
            - name: finds
              label: Home Finds & Deals
            - name: diy
              label: IKEA Hacks & DIY
            - name: color
              label: Color & Paint
            - name: wall-decor
              label: Wall Decor & Gallery Walls
            - name: kitchen-dining
              label: Kitchen & Dining
            - name: organization
              label: Organization & Storage
      - name: dek
        label: Summary
        type: text
        required: true
        description: One or two sentences. Used on cards, in Google results and in the pin description.
        options:
          maxlength: 300
      - name: intro
        label: Intro paragraph
        type: text
        description: The lede shown under the headline before the article starts.
      - name: tags
        label: Tags
        type: string
        list: true
      - name: motif
        label: Illustration
        type: select
        description: The drawn cover artwork used on cards and at the top of the post.
        options:
          values:
            - name: arch
              label: Arch & console table
            - name: sofa
              label: Sofa & artwork
            - name: shelf
              label: Shelves & vases
            - name: swatches
              label: Paint swatches
            - name: finds
              label: Shopping finds
            - name: hack
              label: Flat-pack hack
            - name: nook
              label: Reading nook
            - name: fall
              label: Pumpkins & autumn
            - name: flat
              label: Minimal room
            - name: portrait
              label: Bed & arch
            - name: basket
              label: Basket & plant
            - name: plain
              label: Simple object
      - name: featured_image
        label: Featured image — upload (shows on cards, slider & post hero)
        type: image
        description: Main photo for this post. Used on blog cards, homepage slider, and at top of the post. 1500x1000px recommended. Leave empty to use illustration. You can upload any of the hero variations from assets/uploads/.
      - name: pinterest_image
        label: Pinterest pinnable image — 1000x1500px (vertical)
        type: image
        description: Vertical Pinterest image 1000x1500px shown inside post for Pinning. Auto-generated if empty. Upload custom or leave empty to auto-generate from title.
      - name: hero_image
        label: Hero photo (legacy — use Featured image above)
        type: image
        description: Old field — kept for backwards compatibility. Use Featured image above instead. If both set, Featured image wins.
      - name: related
        label: Related posts (optional)
        type: string
        list: true
        description: Slugs of other posts, e.g. small-apartment-decor-ideas. Shown as "Keep reading" at the bottom.
      - name: draft
        label: Draft
        type: boolean
        description: Tick to hide this post from the site. Untick to publish.
      - name: body
        label: Article body
        type: rich-text
        description: |
          Markdown. Normal headings (## and ###), **bold**, [links](/blog.html) and lists work as usual.
          Component blocks, each on its own line at the start and end:
          :::callout Title  ...  :::   a highlighted tip box
          :::steps  then a numbered list, then  :::   big numbered steps
          :::shop Title  then a  | Item | Detail | Price |  table, then  :::   a shopping list
          :::ad   an ad slot (one is added automatically, use this for a second)
          A "## Frequently asked questions" section with ### question headings becomes an accordion with FAQ markup for Google.
    actions:
      - name: view-post
        label: View Post
        workflow: view-post.yml
        scope: entry
        confirm: false

  - name: comments
    label: Comments (anonymous)
    type: collection
    path: content/comments
    format: yaml-frontmatter
    filename:
      template: "{fields.post_slug}-{year}-{month}-{day}-{primary}.yml"
      field: create
    view:
      primary: author
      sort: date
      order: desc
      fields: [post_slug, author, date, approved]
    fields:
      - name: post_slug
        label: Post slug
        type: string
        required: true
        description: Slug of the post this comment belongs to, e.g. living-room-layout-mistakes
      - name: author
        label: Author name
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: body
        label: Comment
        type: text
        required: true
        options:
          maxlength: 1000
      - name: approved
        label: Approved
        type: boolean
        description: Tick to show on live site. Untick to hide.

  - name: custom-pages
    label: Custom Pages (create any page)
    type: collection
    path: content/custom-pages
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: false
    exclude:
      - README.md
    view:
      primary: title
      sort: title
      fields: [title, slug]
    fields:
      - name: title
        label: SEO title (browser tab)
        type: string
        required: true
        description: e.g. Press Kit — HomeDecorPad — keep under 60 chars
      - name: slug
        label: URL slug (optional — leave empty)
        type: string
        description: |
          Leave empty — auto-generated from title, e.g. "Press Kit" → /press-kit.html
          Only fill if you want a different URL, e.g. press → /press.html
        pattern: "^[a-z0-9-]+$"
        options:
          maxlength: 80
      - name: h1
        label: Headline (H1) — optional
        type: string
        description: Big headline on page. If empty, uses SEO title.
      - name: eyebrow
        label: Eyebrow (small uppercase above H1)
        type: string
      - name: lede
        label: Lede (intro paragraph under H1)
        type: text
      - name: description
        label: Meta description (for Google)
        type: text
        required: true
        description: 1-2 sentences for search results
        options:
          maxlength: 300
      - name: hero_image
        label: Hero image (optional)
        type: image
        description: Upload a photo to show at top of page. Leave empty for no image.
      - name: body
        label: Page content
        type: rich-text
        description: Markdown — headings, bold, links, lists, images all work. This is the main page content.
    actions:
      - name: view-page
        label: View Page
        workflow: view-post.yml
        scope: entry
        confirm: false

  - name: legal
    label: Legal pages
    type: group
    items:
      - name: privacy
        label: Privacy Policy
        type: file
        path: content/legal/privacy-policy.md
      - name: cookies
        label: Cookie Policy
        type: file
        path: content/legal/cookie-policy.md
      - name: terms
        label: Terms of Use
        type: file
        path: content/legal/terms-of-use.md
      - name: disclaimer
        label: Disclaimer
        type: file
        path: content/legal/disclaimer.md
      - name: affiliate
        label: Affiliate & Advertising Disclosure
        type: file
        path: content/legal/affiliate-disclosure.md

  - name: redirects
    label: Redirects (renamed pages)
    type: file
    path: content/redirects.yml

  - name: home
    label: Home page
    type: file
    path: content/home.yml
    actions:
      - name: view-page
        label: View Page
        workflow: view-post.yml
        scope: entry
        confirm: false
    fields:
      - name: hero_eyebrow
        label: Hero — eyebrow
        type: string
      - name: hero_title
        label: Hero — title
        type: string
        required: true
      - name: hero_lede
        label: Hero — lede (paragraph under title)
        type: text
        required: true
      - name: hero_image
        label: Hero — image (optional, replaces illustration)
        type: image
        description: Upload a photo to replace the drawn hero art. Leave empty to use illustration.
      - name: hero_motif
        label: Hero — illustration (if no image)
        type: select
        options:
          values:
            - name: hero
              label: Hero (default)
            - name: arch
              label: Arch & console
            - name: sofa
              label: Sofa & artwork
            - name: shelf
              label: Shelves & vases
            - name: flat
              label: Minimal room
            - name: finds
              label: Shopping finds
            - name: basket
              label: Basket & plant
      - name: hero_buttons
        label: Hero — buttons
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
            description: e.g. /start-here.html or /blog.html or post:slug
          - name: style
            label: Style
            type: select
            options:
              values:
                - name: primary
                  label: Primary (filled)
                - name: ghost
                  label: Ghost (outline)
                - name: outline
                  label: Outline (Pinterest style)
      - name: trust_badges
        label: Hero — trust badges (under buttons)
        type: string
        list: true
        description: e.g. Budget-first picks
      - name: slider_enabled
        label: Hero Slider — enable slider (top 5 posts)
        type: boolean
        description: Tick to replace static hero with auto-flipping slider of top 5 posts
      - name: slider_title
        label: Hero Slider — title above slider
        type: string
        description: e.g. Top 5 this month
      - name: slider_autoplay
        label: Hero Slider — autoplay seconds
        type: number
        description: Seconds per slide, e.g. 5
      - name: slider_posts
        label: Hero Slider — top 5 post slugs
        type: string
        list: true
        description: Slugs of 5 most viewed posts, e.g. living-room-layout-mistakes. Order is slide order.
      - name: slider_show_dots
        label: Hero Slider — show dots
        type: boolean
      - name: slider_show_arrows
        label: Hero Slider — show arrows
        type: boolean
      - name: browse_title
        label: Browse by room — title
        type: string
      - name: browse_link_text
        label: Browse by room — link text
        type: string
      - name: browse_link_url
        label: Browse by room — link URL
        type: string
      - name: featured_eyebrow
        label: Featured — eyebrow
        type: string
      - name: featured_title
        label: Featured — title
        type: string
      - name: latest_eyebrow
        label: Latest — eyebrow
        type: string
      - name: latest_title
        label: Latest — title
        type: string
      - name: latest_link_text
        label: Latest — link text
        type: string
      - name: latest_link_url
        label: Latest — link URL
        type: string
      - name: latest_count
        label: Latest — number of posts to show
        type: number
      - name: signature_eyebrow
        label: Signature series — eyebrow
        type: string
      - name: signature_title
        label: Signature series — title
        type: string
      - name: signature_description
        label: Signature series — description
        type: text
      - name: signature_image
        label: Signature series — image (optional)
        type: image
      - name: signature_motif
        label: Signature series — illustration
        type: select
        options:
          values:
            - name: arch
              label: Arch & console
            - name: sofa
              label: Sofa
            - name: shelf
              label: Shelves
            - name: flat
              label: Minimal room
            - name: basket
              label: Basket
            - name: finds
              label: Finds
            - name: hero
              label: Hero
      - name: signature_links
        label: Signature series — links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
            description: e.g. post:one-room-three-budgets-cozy-bedroom or /blog.html
      - name: start_here_eyebrow
        label: Start here — eyebrow
        type: string
      - name: start_here_title
        label: Start here — title
        type: string
      - name: start_here_link_text
        label: Start here — link text
        type: string
      - name: start_here_link_url
        label: Start here — link URL
        type: string
      - name: start_here_cards
        label: Start here — cards (2 cards)
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: description
            label: Description
            type: text
          - name: link_text
            label: Link text
            type: string
          - name: link_url
            label: Link URL
            type: string
            description: e.g. post:living-room-layout-mistakes

  - name: header
    label: Header & Navigation
    type: file
    path: content/navigation.yml
    fields:
      - name: logo_text
        label: Logo text (optional override)
        type: string
        description: Leave empty to use brand from Site settings
      - name: logo_image
        label: Logo image (optional, replaces icon)
        type: image
        description: Square PNG recommended. Leave empty to use default icon.
      - name: nav_links
        label: Navigation links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
            description: e.g. /index.html, /blog.html, /shop-my-home.html, /about.html
          - name: style
            label: Style
            type: select
            options:
              values:
                - name: default
                  label: Default (uppercase)
                - name: outline
                  label: Outline button (like Shop My Home)
                - name: primary
                  label: Primary button (filled)
      - name: pinterest_url
        label: Pinterest URL
        type: string
        description: e.g. https://www.pinterest.com/yourhandle/
      - name: pinterest_label
        label: Pinterest button label
        type: string
      - name: show_pinterest
        label: Show Pinterest button
        type: boolean

  - name: footer
    label: Footer
    type: file
    path: content/footer.yml
    fields:
      - name: description
        label: Footer description
        type: text
      - name: copyright
        label: Copyright line
        type: string
      - name: disclosure_text
        label: Disclosure text (under footer)
        type: text
      - name: explore_links
        label: Explore links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
      - name: room_guides
        label: Room guides links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
      - name: legal_links
        label: Legal links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
      - name: social
        label: Social links
        type: object
        fields:
          - name: pinterest
            label: Pinterest URL
            type: string
          - name: instagram
            label: Instagram URL
            type: string
          - name: facebook
            label: Facebook URL
            type: string
          - name: youtube
            label: YouTube URL
            type: string

  - name: pages
    label: Pages (Shop, Start Here, About, Contact, Blog)
    type: group
    items:
      - name: start-here
        label: Start Here page
        type: file
        path: content/pages/start-here.yml
        actions:
          - name: view-page
            label: View Page
            workflow: view-post.yml
            scope: entry
            confirm: false
      - name: about
        label: About page
        type: file
        path: content/pages/about.yml
        actions:
          - name: view-page
            label: View Page
            workflow: view-post.yml
            scope: entry
            confirm: false
      - name: contact
        label: Contact page
        type: file
        path: content/pages/contact.yml
        actions:
          - name: view-page
            label: View Page
            workflow: view-post.yml
            scope: entry
            confirm: false
      - name: shop
        label: Shop My Home page
        type: file
        path: content/pages/shop-my-home.yml
        actions:
          - name: view-page
            label: View Page
            workflow: view-post.yml
            scope: entry
            confirm: false
      - name: blog
        label: Blog listing page
        type: file
        path: content/pages/blog.yml
        actions:
          - name: view-page
            label: View Page
            workflow: view-post.yml
            scope: entry
            confirm: false
        fields:
          - name: title
            label: SEO Title
            type: string
            description: Browser title, e.g. All Decor Ideas — Room Guides & Budget Makeovers
          - name: h1
            label: H1 Headline
            type: string
            description: Main headline on blog page
          - name: eyebrow
            label: Eyebrow (small label above H1)
            type: string
          - name: lede
            label: Intro paragraph (lede)
            type: text
            description: One or two sentences under H1
          - name: search_placeholder
            label: Search placeholder
            type: string
            description: e.g. Search small apartment, rug, paint...
          - name: empty_text
            label: Empty search message
            type: text
          - name: display_mode
            label: Display mode
            type: select
            description: How to show posts — newest first always
            options:
              values:
                - name: grid
                  label: Grid (cards, newest first)
                - name: list
                  label: List (compact, newest first)
          - name: show_filters
            label: Show category filters
            type: boolean
            description: Show filter buttons for categories
          - name: posts_per_page
            label: Posts per page (0 = show all)
            type: number
            description: Leave 0 to show all posts newest to oldest


  - name: site
    label: Site settings
    type: file
    path: content/site.yml
    fields:
      - name: brand
        label: Site name
        type: string
        required: true
      - name: domain
        label: Canonical domain
        type: string
        required: true
        description: The address search engines should index, e.g. https://homedecorpad.com — no trailing slash. Change this when you connect your own domain.
      - name: email
        label: Contact email
        type: string
        required: true
      - name: legal_effective_date
        label: Legal pages — effective date
        type: string
        description: Shown on the Privacy Policy and the other legal pages. Format 2026-09-23.
      - name: legal_updated_date
        label: Legal pages — last updated
        type: string
        description: Bump this by hand whenever you materially change a legal page.
      - name: amazon_tag
        label: Amazon Associates tag
        type: string
        description: Your tracking ID, e.g. yourname-20. Leave as-is until Amazon approves you.
      - name: formspree_id
        label: Formspree form ID
        type: string
        description: From formspree.io. The part after /f/ in your form endpoint.
      - name: adsense_client
        label: AdSense publisher ID
        type: string
        description: e.g. ca-pub-1234567890123456. Leave empty and ads stay switched off everywhere.
      - name: ga4_id
        label: Google Analytics ID
        type: string
        description: e.g. G-ABCDE12345. Leave empty and analytics stays switched off.
      - name: pinterest_verify
        label: Pinterest verification code
        type: string
        description: From Pinterest > Settings > Claimed accounts. Leave empty to omit the meta tag.
      - name: social
        label: Social profiles
        type: object
        fields:
          - name: pinterest
            label: Pinterest URL
            type: string
          - name: instagram
            label: Instagram URL
            type: string
          - name: facebook
            label: Facebook URL
            type: string
          - name: youtube
            label: YouTube URL
            type: string
      - name: giscus_enabled
        label: Enable comments (Giscus)
        type: boolean
        description: Tick to show a comment section at the bottom of every blog post. Uses GitHub Discussions — free, no ads. Requires Discussions enabled in repo settings.
      - name: giscus_repo
        label: Giscus — repo (owner/repo)
        type: string
        description: e.g. RedLaxx/homedecorpad-site
      - name: giscus_repo_id
        label: Giscus — repo ID
        type: string
        description: From https://giscus.app — e.g. R_kgDOUoGanw
      - name: giscus_category
        label: Giscus — discussion category
        type: string
        description: e.g. General, or Comments. Create it in GitHub > Discussions > Categories.
      - name: giscus_category_id
        label: Giscus — category ID
        type: string
        description: From https://giscus.app — e.g. DIC_kwDOUoGan...
      - name: giscus_mapping
        label: Giscus — mapping
        type: select
        description: How to map post to discussion. pathname is recommended.
        options:
          values:
            - name: pathname
              label: pathname (/blog/category/slug.html)
            - name: url
              label: url (full URL)
            - name: title
              label: title
            - name: og:title
              label: og:title
      - name: giscus_theme
        label: Giscus — theme
        type: select
        description: Visual theme for the comment widget.
        options:
          values:
            - name: light
              label: light
            - name: dark
              label: dark
            - name: preferred_color_scheme
              label: auto (follows user)
            - name: transparent_dark
              label: transparent_dark
      - name: comment_system
        label: Comment system
        type: select
        description: giscus = GitHub login. cusdis = anonymous no login. both = tabbed with Cusdis on top (recommended).
        options:
          values:
            - name: both
              label: Both — Anonymous on top, GitHub below (recommended)
            - name: giscus
              label: Giscus only (GitHub login required)
            - name: cusdis
              label: Cusdis only (anonymous, no login)
            - name: none
              label: Off
      - name: cusdis_enabled
        label: Enable anonymous comments (Cusdis)
        type: boolean
        description: Tick to allow anonymous comments without login. Needs Cusdis App ID below.
      - name: cusdis_app_id
        label: Cusdis — App ID
        type: string
        description: Get free ID at https://cusdis.com — Dashboard → New Website → copy App ID
      - name: cusdis_host
        label: Cusdis — host
        type: string
        description: Usually https://cusdis.com, or your self-hosted URL
      - name: cusdis_theme
        label: Cusdis — theme
        type: select
        description: Theme for Cusdis widget
        options:
          values:
            - name: light
              label: light
            - name: dark
              label: dark
            - name: auto
              label: auto

settings:
  content:
    merge: true
  commit:
    identity: user
    template: "{{path}} updated from Pages CMS"

actions:
  - name: rebuild
    label: Rebuild & publish site
    workflow: build.yml
